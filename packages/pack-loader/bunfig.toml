telemetry = false
env = false

[test]
root = "./tests"
pathIgnorePatterns = [ "packages/**", "node_modules/**", "dist/**", "types/**" ]
concurrentTestGlob = "**/*"

[fmt]
printWidth = 120 # JetBrains convention
tabWidth = 4 # JetBrains convention
endOfLine = "lf"
semi = true
ignorePatterns = [ "packages/**", "node_modules/**", "dist/**", "types/**" ]
sortImports = true
jsdoc = { descriptionWithDot = true, commentLineStrategy = "multiline" }
