name: Web Demo

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v3

    - uses: oven-sh/setup-bun@v2
      name: Setup Bun

    - name: Build Library
      run: |
        bun install --frozen-lockfile

    - name: Build Demo
      run: |
        cd packages/demo
        bun install --frozen-lockfile
        bun run build-pages
        cd ../..

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'packages/demo/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
